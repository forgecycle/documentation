name: Deploy

# Publishes the site to GitHub Pages (Settings > Pages > Source: GitHub
# Actions). The pages under src/content/docs/{start,concepts,guides,reference}
# are generated from the private forgecycle/forgecycle repository by its docs
# workflow, which commits them here; a push to main then deploys them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
